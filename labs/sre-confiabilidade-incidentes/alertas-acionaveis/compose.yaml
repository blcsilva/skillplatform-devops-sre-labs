services:
  lab:
    build: .
    container_name: skill-lab-${LAB_SLUG:-observability}
    volumes:
      - ./workspace:/workspace
    command: sleep infinity
  demo-app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./app:/app
    command: python app.py
    ports:
      - "8088:8088"
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
